<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master TIU - Jarak, Kecepatan, Waktu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .cat-card { transition: all 0.2s ease-in-out; }
        .cat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05); }
        .cat-card.selected { border-color: #0ea5e9; background-color: #f0f9ff; box-shadow: 0 0 0 2px #0ea5e9; }
        
        .opt-btn { transition: all 0.15s ease; }
        .opt-btn:hover:not(:disabled) { border-color: #7dd3fc; background-color: #f0f9ff; }
        .opt-btn.selected { background-color: #0ea5e9; color: white; border-color: #0284c7; }
        .opt-btn.selected .opt-letter { background-color: white; color: #0ea5e9; }
        
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .timer-pulse { animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0%, 100% { color: #e11d48; } 50% { color: #fda4af; } }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex justify-center items-center py-6 px-4 sm:px-6">

    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden relative border border-slate-200">
        
        <!-- Header -->
        <div class="header-bg text-white p-6 sm:p-8 text-center relative border-b-4 border-sky-500">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center justify-center gap-3">
                <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Latihan Soal JKW (Dinamis + Jebakan)
            </h1>
            <p class="text-slate-300 mt-2 text-sm sm:text-base">Cocok untuk persiapan CPNS, Sekolah Kedinasan, dan Ujian Umum</p>
        </div>

        <!-- Home Screen -->
        <div id="home-screen" class="p-6 sm:p-10 fade-in">
            <!-- Pengaturan Waktu -->
            <div class="mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span class="bg-sky-100 text-sky-600 px-2 py-1 rounded-md">1</span> Pengaturan Waktu
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <label class="cursor-pointer relative">
                        <input type="radio" name="timer" value="60" class="peer sr-only" checked>
                        <div class="p-4 border-2 border-slate-300 rounded-xl peer-checked:border-sky-500 peer-checked:bg-sky-50 text-center h-full flex flex-col justify-center transition">
                            <span class="block text-lg font-bold text-slate-700 peer-checked:text-sky-700">1 Menit / Soal</span>
                            <span class="inline-block mt-1 text-xs font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded-md mx-auto">Standar SKD</span>
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="timer" value="120" class="peer sr-only">
                        <div class="p-4 border-2 border-slate-300 rounded-xl peer-checked:border-sky-500 peer-checked:bg-sky-50 text-center h-full flex flex-col justify-center transition">
                            <span class="block text-lg font-bold text-slate-700 peer-checked:text-sky-700">2 Menit / Soal</span>
                            <span class="inline-block mt-1 text-xs font-bold text-slate-500 mx-auto bg-slate-200 px-2 py-1 rounded-md">Lebih Santai</span>
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="timer" value="0" class="peer sr-only">
                        <div class="p-4 border-2 border-slate-300 rounded-xl peer-checked:border-sky-500 peer-checked:bg-sky-50 text-center h-full flex flex-col justify-center transition">
                            <span class="block text-lg font-bold text-slate-700 peer-checked:text-sky-700">Tanpa Waktu</span>
                            <span class="inline-block mt-1 text-xs font-bold text-white bg-sky-500 px-2 py-1 rounded-md mx-auto">Latihan Bebas</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Pilih Kategori -->
            <div class="mb-8">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span class="bg-sky-100 text-sky-600 px-2 py-1 rounded-md">2</span> Pilih Kategori Topik
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="category-grid">
                    <!-- Cards will be injected via JS -->
                </div>
            </div>

            <button onclick="startQuiz()" id="start-btn" class="w-full bg-slate-200 text-slate-500 font-bold py-4 rounded-xl transition text-lg cursor-not-allowed" disabled>
                PILIH KATEGORI TERLEBIH DAHULU
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="p-6 sm:p-10 hidden flex-col min-h-[500px]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 pb-4 mb-6 gap-4">
                <div>
                    <div class="flex items-center gap-3">
                        <span id="question-counter" class="bg-slate-800 text-white text-xs font-bold px-3 py-1 rounded tracking-wide">SOAL 1/10</span>
                        <span id="difficulty-badge" class="text-xs font-bold px-3 py-1 rounded border bg-slate-100">MUDAH</span>
                    </div>
                    <p id="quiz-category-title" class="text-sm text-slate-500 mt-2 font-medium">Kategori: Campuran</p>
                </div>
                <!-- Box Timer (Akan disembunyikan jika "Tanpa Waktu") -->
                <div id="timer-box-container">
                    <div id="timer-box" class="flex items-center gap-2 bg-slate-100 text-slate-700 border border-slate-200 px-4 py-2 rounded-lg font-bold transition-colors duration-300">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span id="timer-display" class="text-lg tabular-nums tracking-wider">01:00</span>
                    </div>
                </div>
            </div>

            <div class="mb-6 flex-grow flex flex-col">
                <div class="bg-blue-50/50 p-5 sm:p-6 rounded-2xl border border-blue-100 mb-6 text-slate-800 text-lg leading-relaxed font-medium" id="question-text">
                    <!-- Soal muncul di sini -->
                </div>
                
                <div id="options-container" class="space-y-3 mt-auto">
                    <!-- Pilihan Ganda -->
                </div>
            </div>

            <button id="next-btn" onclick="submitAnswer()" class="w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-xl cursor-not-allowed transition text-lg" disabled>
                PILIH JAWABAN
            </button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="p-6 sm:p-10 hidden bg-slate-50">
            <div class="text-center mb-8 bg-slate-800 rounded-3xl p-8 shadow-lg">
                <h2 class="text-2xl font-bold text-slate-300 mb-2 uppercase tracking-wider text-sm">Skor Akhir Anda</h2>
                <div class="text-6xl font-extrabold text-sky-400 my-2" id="final-score">0</div>
                <div id="result-summary" class="inline-block mt-4 bg-slate-700 text-slate-200 px-4 py-2 rounded-lg font-medium">
                    Benar: 0 | Salah: 0
                </div>
            </div>

            <div class="mb-6">
                <h3 class="font-bold text-xl mb-4 text-slate-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Pembahasan Detail & Evaluasi Jebakan
                </h3>
                <div id="review-container" class="space-y-4">
                    <!-- Konten Review -->
                </div>
            </div>

            <button onclick="resetApp()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl transition text-lg mt-4 shadow-lg uppercase tracking-wide">
                Latihan Lagi
            </button>
        </div>
    </div>

    <script>
        // Data Kamus Umum
        const names = ["Andi", "Budi", "Citra", "Dimas", "Eka", "Fajar", "Gilang", "Hana", "Iqbal", "Jojo"];
        const cities = ["Kota A", "Kota B", "Kota C", "Jakarta", "Bandung", "Surabaya", "Semarang", "Yogyakarta"];
        const vehicles = ["mobil", "sepeda motor", "bus", "kereta", "sepeda"];

        const categories = [
            { id: 1, title: "Segitiga JKW Dasar", desc: "Mencari J, K, atau W (Berbagai Variasi).", icon: "📐" },
            { id: 2, title: "Konversi Satuan", desc: "Bolak-balik km/jam ke m/s dengan jebakan.", icon: "⏱️" },
            { id: 3, title: "Papasan Waktu Sama", desc: "Cari waktu & Jarak papasan.", icon: "🤝" },
            { id: 4, title: "Papasan Waktu Beda", desc: "Cari waktu papasan beda keberangkatan.", icon: "⏳" },
            { id: 5, title: "Menyusul (Searah)", desc: "Pengejaran dengan selisih waktu/jarak.", icon: "🏃" },
            { id: 6, title: "Kecepatan Rata-Rata", desc: "Rumus khusus rute Pulang-Pergi (Awas Jebakan).", icon: "🔄" },
            { id: 7, title: "CAMPURAN (Tryout)", desc: "10 soal acak dari semua materi JKW.", icon: "🔥", isSpecial: true }
        ];

        let selectedCategoryId = null;
        let timePerQuestion = 60;
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];
        let timerInterval;
        let timeRemaining = 0;
        let currentSelectedOption = null;
        const totalQuestions = 10;

        // Utilities
        const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const getTwo = (arr) => { let a = rand(arr), b = rand(arr); while (a === b) b = rand(arr); return [a, b]; };
        
        const addMins = (timeStr, mins) => {
            let [h, m] = timeStr.split(':').map(Number);
            let totalMins = (h * 60) + m + mins;
            let finalH = Math.floor(totalMins / 60) % 24;
            let finalM = Math.round(totalMins % 60);
            return `${finalH.toString().padStart(2, '0')}:${finalM.toString().padStart(2, '0')}`;
        };

        // Pembuat Opsi dengan dukungan Distraktor Manual (Jebakan)
        const genOptions = (correct, manualDistractors, unit = "") => {
            let ops = new Set();
            let cStr = typeof correct === 'number' && correct % 1 !== 0 ? correct.toFixed(2) : correct.toString();
            ops.add(cStr);
            
            // Masukkan jebakan manual dari pembuat soal
            for(let d of manualDistractors) {
                let dStr = typeof d === 'number' && d % 1 !== 0 ? d.toFixed(2) : d.toString();
                if(ops.size < 5 && dStr !== cStr) ops.add(dStr);
            }
            
            // Jika masih kurang dari 5 opsi, isi dengan angka di sekitar jawaban benar
            let isNumber = !isNaN(parseFloat(correct));
            let modifier = 1;
            while(ops.size < 5) {
                let fallback = isNumber ? parseFloat(correct) + modifier : addMins(correct, modifier * 15);
                let fStr = typeof fallback === 'number' ? fallback.toString() : fallback;
                if(!ops.has(fStr)) ops.add(fStr);
                modifier = modifier > 0 ? -modifier : (-modifier) + 1; // +1, -1, +2, -2...
            }

            return Array.from(ops).map(x => ({ 
                text: x + (unit ? ` ${unit}` : ''), 
                isCorrect: x === cStr 
            })).sort(() => Math.random() - 0.5); // SHUFFLE ACAK ABCDE
        };

        function createQuestion(typeId) {
            let p = getTwo(names), loc = getTwo(cities), veh = getTwo(vehicles);
            let q = { category: typeId };
            
            switch(typeId) {
                case 1: { // JKW Dasar
                    let subType = rand([1, 2, 3]);
                    let v = rand([40, 50, 60, 80]); // km/jam
                    let wHours = rand([1, 1.5, 2, 2.5, 3]); // jam
                    let wMins = wHours * 60;
                    let j = v * wHours; // km

                    if (subType === 1) { // Cari Jarak
                        q.difficulty = 'Mudah';
                        q.text = `${p[0]} mengendarai ${veh[0]} dengan kecepatan ${v} km/jam selama ${wMins} menit. Jarak yang ditempuh ${p[0]} adalah ...`;
                        let trap1 = v / wHours; // Jebakan: dibagi bukan dikali
                        let trap2 = v * wMins; // Jebakan: lupa ubah menit ke jam
                        q.options = genOptions(j, [trap1, trap2, j+10, j-20], "km");
                        q.explanation = `<b>Awas Jebakan:</b> Jangan langsung mengalikan dengan ${wMins} (menit). Ubah ke jam dulu!<br>Waktu = ${wMins} menit = ${wHours} jam.<br>Jarak = Kecepatan × Waktu = ${v} × ${wHours} = <b>${j} km</b>.`;
                    } else if (subType === 2) { // Cari Kecepatan
                        q.difficulty = 'Sedang';
                        q.text = `Jarak ${loc[0]} ke ${loc[1]} adalah ${j} km. Jika ${p[0]} menempuh jarak tersebut dalam waktu ${wMins} menit, berapakah kecepatan rata-ratanya?`;
                        let trap1 = j * wHours; // Jebakan dikali
                        let trap2 = j / wMins; // Jebakan tidak ubah ke jam
                        q.options = genOptions(v, [trap1, trap2, v+10, v-10], "km/jam");
                        q.explanation = `<b>Langkah 1:</b> Ubah waktu ke jam. ${wMins} menit = ${wHours} jam.<br><b>Langkah 2:</b> Kecepatan = Jarak / Waktu = ${j} / ${wHours} = <b>${v} km/jam</b>.`;
                    } else { // Cari Waktu Tiba + Istirahat (HOTS)
                        q.difficulty = 'HOTS 🔥';
                        let restMins = rand([15, 30, 45]);
                        let start = `0${rand([6,7])}:${rand(['00','15','30'])}`;
                        let arriveTrue = addMins(start, wMins + restMins);
                        let trapNoRest = addMins(start, wMins); // Jebakan: lupa istirahat
                        
                        q.text = `${p[0]} berangkat dari ${loc[0]} menuju ${loc[1]} berjarak ${j} km pada pukul ${start} dengan kecepatan ${v} km/jam. Di perjalanan, ia istirahat selama ${restMins} menit. Pukul berapakah ia tiba?`;
                        q.options = genOptions(arriveTrue, [trapNoRest, addMins(arriveTrue, 30), addMins(arriveTrue, -15)]);
                        q.explanation = `<b>Hati-hati:</b> Jangan lupa tambahkan waktu istirahat!<br>Waktu tempuh normal = Jarak/Kecepatan = ${j}/${v} = ${wHours} jam (${wMins} menit).<br>Total waktu perjalanan = ${wMins} + ${restMins} = ${wMins + restMins} menit.<br>Waktu Tiba = ${start} + ${wMins+restMins} menit = <b>${arriveTrue}</b>.`;
                    }
                    break;
                }
                case 2: { // Konversi Satuan
                    let subType = rand([1, 2]);
                    if (subType === 1) { // km/jam ke m/s
                        q.difficulty = 'Mudah';
                        let kmh = rand([36, 54, 72, 90, 108]);
                        let ms = kmh * (5/18);
                        let trap = kmh * (18/5); // Jebakan rumus terbalik
                        q.text = `Kecepatan seekor macan tutul adalah ${kmh} km/jam. Jika dikonversi, kecepatan tersebut setara dengan ...`;
                        q.options = genOptions(ms, [trap, ms+5, ms*2, ms-2], "m/s");
                        q.explanation = `<b>Rumus Cepat:</b> Dari km/jam ke m/s, kalikan dengan <b>5/18</b>.<br>${kmh} × (5/18) = <b>${ms} m/s</b>.`;
                    } else { // m/s ke km/jam dengan cerita (Sedang)
                        q.difficulty = 'Sedang';
                        let ms = rand([10, 15, 20, 25]);
                        let kmh = ms * (18/5);
                        let distKm = rand([2, 3, 4]) * kmh; // agar wHours bulat
                        let wHours = distKm / kmh;
                        
                        let trapNoConv = distKm / ms; // Jebakan: jarak (km) dibagi kecepatan m/s langsung
                        
                        q.text = `Sebuah mobil melaju konstan dengan kecepatan ${ms} m/s. Berapa jam waktu yang dibutuhkan mobil tersebut untuk menempuh jarak ${distKm} km?`;
                        q.options = genOptions(wHours, [trapNoConv, wHours*2, wHours+2, wHours-1], "jam");
                        q.explanation = `<b>Awas Satuan Berbeda!</b><br>Ubah m/s ke km/jam dengan mengalikan <b>18/5</b>.<br>Kecepatan = ${ms} × (18/5) = ${kmh} km/jam.<br>Waktu = Jarak / Kecepatan = ${distKm} / ${kmh} = <b>${wHours} jam</b>.`;
                    }
                    break;
                }
                case 3: { // Papasan Waktu Sama
                    let subType = rand([1, 2]);
                    let kA = rand([40, 50, 60]); 
                    let kB = rand([40, 50, 60]); 
                    let wJam = rand([1, 1.5, 2, 2.5]);
                    let jTotal = (kA + kB) * wJam;
                    let start = `0${rand([6,7,8])}:00`;
                    
                    if (subType === 1) { // Cari Waktu Ketemu
                        q.difficulty = 'Sedang';
                        let ketemu = addMins(start, wJam * 60);
                        let trapSelisih = addMins(start, (jTotal/Math.abs(kA-kB))*60); // Jebakan: K ditambah bukannya dikurang
                        let trapSatuK = addMins(start, (jTotal/kA)*60); // Jebakan: Lupa tambah K kedua
                        
                        q.text = `Jarak ${loc[0]} dan ${loc[1]} adalah ${jTotal} km. Pukul ${start}, ${p[0]} berangkat dari ${loc[0]} (kecepatan ${kA} km/jam) menuju ${loc[1]}. Pada saat yang sama, ${p[1]} berangkat dari ${loc[1]} menuju ${loc[0]} (kecepatan ${kB} km/jam). Pukul berapa mereka berpapasan?`;
                        q.options = genOptions(ketemu, [trapSelisih, trapSatuK, addMins(ketemu, 30), addMins(ketemu, -30)]);
                        q.explanation = `<b>Rumus Papasan (Waktu Sama):</b> W = Jarak Total / (K1 + K2)<br>W = ${jTotal} / (${kA} + ${kB}) = ${jTotal} / ${kA+kB} = ${wJam} jam.<br>Pukul Berpapasan = ${start} + ${wJam} jam = <b>${ketemu}</b>.`;
                    } else { // Cari Jarak dr Kota A
                        q.difficulty = 'HOTS 🔥';
                        let jarakDariA = kA * wJam;
                        let trapJarakB = kB * wJam; // Jebakan: jarak dr kota B
                        
                        q.text = `Jarak ${loc[0]} ke ${loc[1]} adalah ${jTotal} km. Pukul ${start}, ${p[0]} berangkat dari ${loc[0]} (kecepatan ${kA} km/jam). Bersamaan, ${p[1]} dari ${loc[1]} (kecepatan ${kB} km/jam) menuju ${loc[0]}. Pada jarak berapa dari ${loc[0]} mereka saling berpapasan?`;
                        q.options = genOptions(jarakDariA, [trapJarakB, jarakDariA+10, jTotal/2], "km");
                        q.explanation = `1. Hitung Waktu Papasan = ${jTotal} / (${kA}+${kB}) = ${wJam} jam.<br>2. <b>Hati-hati:</b> Yang ditanya jarak dari ${loc[0]} (tempat asal ${p[0]}).<br>Jarak = Kecepatan ${p[0]} × Waktu Papasan = ${kA} × ${wJam} = <b>${jarakDariA} km</b>.`;
                    }
                    break;
                }
                case 4: { // Papasan Beda Waktu
                    q.difficulty = 'HOTS 🔥';
                    const setBeda = [
                        { k1: 40, k2: 60, beda: 30, wSisaJam: 1 }, 
                        { k1: 50, k2: 70, beda: 30, wSisaJam: 1.5 },
                        { k1: 60, k2: 80, beda: 15, wSisaJam: 1 }
                    ];
                    let ch = rand(setBeda);
                    let jTotal = (ch.k1 * (ch.beda/60)) + ((ch.k1 + ch.k2) * ch.wSisaJam);
                    let start1 = `07:00`;
                    let start2 = addMins(start1, ch.beda);
                    let waktuKetemu = addMins(start2, ch.wSisaJam * 60);
                    
                    let trapStart1 = addMins(start1, ch.wSisaJam * 60); // Jebakan: ngitung dari start 1

                    q.text = `Jarak ${loc[0]}-${loc[1]} adalah ${jTotal} km. ${p[0]} berangkat dari ${loc[0]} pukul ${start1} dg kecepatan ${ch.k1} km/jam. Pukul ${start2}, ${p[1]} berangkat dari ${loc[1]} menuju ${loc[0]} dg kecepatan ${ch.k2} km/jam. Pukul berapa mereka berpapasan?`;
                    q.options = genOptions(waktuKetemu, [trapStart1, addMins(waktuKetemu, 30), addMins(waktuKetemu, -15)]);
                    q.explanation = `1. Selisih waktu = ${ch.beda} menit = ${ch.beda/60} jam.<br>2. Jarak yg sudah ditempuh ${p[0]} = ${ch.k1} × ${ch.beda/60} = ${ch.k1 * (ch.beda/60)} km.<br>3. Sisa Jarak = ${jTotal} - ${ch.k1 * (ch.beda/60)} = ${jTotal - (ch.k1 * (ch.beda/60))} km.<br>4. Waktu Temu = Sisa Jarak / (K1+K2) = ${ch.wSisaJam} jam.<br>5. <b>Awas!</b> Tambahkan ke waktu berangkat <b>Orang Kedua (${start2})</b>. Tiba = ${start2} + ${ch.wSisaJam} jam = <b>${waktuKetemu}</b>.`;
                    break;
                }
                case 5: { // Menyusul
                    q.difficulty = 'Susah';
                    const setNyusul = [
                        { k1: 40, k2: 60, beda: 30 }, // jarak=20, nyusul 1 jam
                        { k1: 50, k2: 75, beda: 30 }, // jarak=25, nyusul 1 jam
                        { k1: 60, k2: 80, beda: 15 }  // jarak=15, nyusul 0.75 jam (45m)
                    ];
                    let ch = rand(setNyusul);
                    let wNyusulJam = (ch.k1 * (ch.beda/60)) / (ch.k2 - ch.k1);
                    
                    let w1 = `06:00`;
                    let w2 = addMins(w1, ch.beda);
                    let wTersusul = addMins(w2, wNyusulJam * 60);
                    
                    let trapTambah = addMins(w2, ((ch.k1 * (ch.beda/60)) / (ch.k2 + ch.k1))*60); // Jebakan: K ditambah bukan dikurang

                    q.text = `${p[0]} berangkat dari ${loc[0]} dengan kecepatan ${ch.k1} km/jam pukul ${w1}. Pukul ${w2}, ${p[1]} menyusul dari tempat yang sama dengan kecepatan ${ch.k2} km/jam. Pukul berapa ${p[1]} berhasil menyusul ${p[0]}?`;
                    q.options = genOptions(wTersusul, [trapTambah, addMins(w1, wNyusulJam*60), addMins(wTersusul, 30)]);
                    q.explanation = `<b>Rumus Menyusul:</b> W = Selisih Jarak / (K2 - K1)<br>1. Selisih Jarak = Kecepatan Orang 1 × Selisih Waktu = ${ch.k1} × ${ch.beda/60} jam = ${ch.k1*(ch.beda/60)} km.<br>2. Waktu Nyusul = ${ch.k1*(ch.beda/60)} / (${ch.k2} - ${ch.k1}) = ${wNyusulJam} jam.<br>3. Pukul tersusul = Pukul berangkat Orang Ke-2 (${w2}) + ${wNyusulJam*60} menit = <b>${wTersusul}</b>.`;
                    break;
                }
                case 6: { // Kecepatan Rata-rata PP
                    let subType = rand([1, 2]);
                    const ppPairs = [
                        {v1: 30, v2: 60, vAvg: 40}, 
                        {v1: 40, v2: 60, vAvg: 48}, 
                        {v1: 20, v2: 30, vAvg: 24}, 
                        {v1: 60, v2: 90, vAvg: 72}
                    ];
                    let cp = rand(ppPairs);
                    
                    if(subType === 1) { // Cari Rata-rata
                        q.difficulty = 'HOTS 🔥';
                        let fakeAvg = (cp.v1 + cp.v2) / 2; // Jebakan Klasik!
                        
                        q.text = `${p[0]} bepergian dari kota A ke kota B dengan kecepatan ${cp.v1} km/jam. Saat pulang melalui rute yang SAMA, lalu lintas lengang sehingga ia memacu kendaraannya ${cp.v2} km/jam. Kecepatan rata-rata perjalanan Pulang-Pergi ${p[0]} adalah ...`;
                        q.options = genOptions(cp.vAvg, [fakeAvg, cp.vAvg+2, cp.vAvg-4], "km/jam");
                        q.explanation = `<b>Jebakan Klasik!</b> Kecepatan rata-rata PP <b>TIDAK BOLEH</b> sekadar (V1+V2)/2.<br><b>Gunakan Rumus Harmonik PP:</b> V = (2 × V1 × V2) / (V1 + V2)<br>V = (2 × ${cp.v1} × ${cp.v2}) / (${cp.v1} + ${cp.v2}) = ${2*cp.v1*cp.v2} / ${cp.v1+cp.v2} = <b>${cp.vAvg} km/jam</b>.`;
                    } else { // Dikasih rata-rata, cari jarak (Gabungan)
                        q.difficulty = 'Susah';
                        let totalWaktuJam = rand([2, 3, 4, 5]); // Waktu PP total
                        let jarakSatuArah = (cp.vAvg * totalWaktuJam) / 2; // Jarak A ke B saja
                        let trapLupaBagi2 = cp.vAvg * totalWaktuJam; // Jebakan: Jarak PP penuh

                        q.text = `Kecepatan rata-rata perjalanan Pulang-Pergi dari rumah ke kantor adalah ${cp.vAvg} km/jam. Jika total waktu yang dihabiskan di jalan (berangkat hingga pulang) adalah ${totalWaktuJam} jam, berapakah jarak dari rumah ke kantor (satu arah)?`;
                        q.options = genOptions(jarakSatuArah, [trapLupaBagi2, jarakSatuArah+10, jarakSatuArah-5], "km");
                        q.explanation = `1. Hitung total jarak (berangkat + pulang) = Kecepatan Rata-rata × Total Waktu = ${cp.vAvg} × ${totalWaktuJam} = ${trapLupaBagi2} km.<br>2. <b>Awas Jebakan:</b> Itu adalah jarak bolak-balik! Jarak rumah ke kantor (satu arah) adalah setengahnya = ${trapLupaBagi2} / 2 = <b>${jarakSatuArah} km</b>.`;
                    }
                    break;
                }
            }
            return q;
        }

        function initApp() {
            const grid = document.getElementById('category-grid');
            categories.forEach(c => {
                const card = document.createElement('div');
                let colorClass = c.isSpecial ? 'bg-sky-50 border-sky-200' : 'bg-white border-slate-200';
                
                card.className = `cat-card cursor-pointer border-2 rounded-xl p-5 relative ${colorClass}`;
                card.onclick = () => selectCategory(c.id, card);
                
                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="text-3xl bg-white p-2 rounded-lg shadow-sm border border-slate-100">${c.icon}</div>
                        <div>
                            <h3 class="font-bold text-slate-800 ${c.isSpecial ? 'text-sky-600' : ''}">${c.title}</h3>
                            <p class="text-xs text-slate-500 mt-1 leading-relaxed">${c.desc}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectCategory(id, cardElem) {
            document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('selected'));
            cardElem.classList.add('selected');
            selectedCategoryId = id;

            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = false;
            startBtn.classList.remove('bg-slate-200', 'text-slate-500', 'cursor-not-allowed');
            startBtn.classList.add('bg-sky-600', 'hover:bg-sky-700', 'text-white', 'shadow-lg');
            startBtn.innerText = "MULAI LATIHAN SEKARANG";
        }

        function startQuiz() {
            timePerQuestion = parseInt(document.querySelector('input[name="timer"]:checked').value);
            questions = [];
            
            for(let i=0; i<totalQuestions; i++) {
                let catToGen = selectedCategoryId === 7 ? Math.floor(Math.random() * 6) + 1 : selectedCategoryId;
                questions.push(createQuestion(catToGen));
            }

            currentIndex = 0; score = 0; userAnswers = [];

            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('fade-in');
            
            let catName = categories.find(c => c.id === selectedCategoryId).title;
            document.getElementById('quiz-category-title').innerText = `Kategori: ${catName}`;

            renderQuestion();
        }

        function getDiffStyle(diff) {
            if(diff === 'Mudah') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
            if(diff === 'Sedang') return 'bg-sky-100 text-sky-700 border-sky-200';
            return 'bg-rose-100 text-rose-700 border-rose-200'; 
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            document.getElementById('question-counter').innerText = `SOAL ${currentIndex + 1}/${totalQuestions}`;
            
            const diffBadge = document.getElementById('difficulty-badge');
            diffBadge.className = `text-xs font-bold px-3 py-1 rounded border ${getDiffStyle(q.difficulty)}`;
            diffBadge.innerText = q.difficulty.toUpperCase();

            document.getElementById('question-text').innerHTML = q.text;
            
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                const letter = String.fromCharCode(65 + idx);
                btn.className = 'opt-btn w-full text-left p-4 border-2 border-slate-200 rounded-xl font-semibold text-slate-700 flex items-center gap-4 bg-white shadow-sm';
                btn.innerHTML = `<span class="opt-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-slate-500 text-sm transition-colors">${letter}</span> <span class="flex-1">${opt.text}</span>`;
                btn.onclick = () => selectOption(btn, opt);
                optContainer.appendChild(btn);
            });

            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.className = 'w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-xl cursor-not-allowed transition text-lg tracking-wide';
            nextBtn.innerText = 'PILIH JAWABAN TERLEBIH DAHULU';

            currentSelectedOption = null;
            startTimer();
        }

        function selectOption(btnElement, optionData) {
            document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
            btnElement.classList.add('selected');
            currentSelectedOption = optionData;

            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            nextBtn.className = 'w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl shadow-md transition transform active:scale-[0.98] text-lg uppercase tracking-wide';
            nextBtn.innerText = currentIndex === totalQuestions - 1 ? 'SELESAI & LIHAT HASIL' : 'KUNCI JAWABAN & LANJUT';
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            const tContainer = document.getElementById('timer-box-container');
            
            if (timePerQuestion === 0) {
                tContainer.classList.add('hidden'); // Tanpa waktu
                return;
            }
            
            tContainer.classList.remove('hidden');
            timeRemaining = timePerQuestion;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerUI();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    handleNext(true); 
                }
            }, 1000);
        }

        function updateTimerUI() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            const box = document.getElementById('timer-box');
            const disp = document.getElementById('timer-display');
            
            disp.innerText = `${m}:${s}`;
            
            if(timeRemaining <= 10) {
                disp.classList.add('timer-pulse');
                box.classList.replace('border-slate-200', 'border-rose-300');
            } else {
                disp.classList.remove('timer-pulse');
                disp.style.color = 'inherit';
                box.classList.replace('border-rose-300', 'border-slate-200');
            }
        }

        function submitAnswer() { 
            if (!currentSelectedOption) return;
            handleNext(false); 
        }

        function handleNext(isTimeout) {
            if(timerInterval) clearInterval(timerInterval);

            let correctOpt = questions[currentIndex].options.find(o => o.isCorrect);
            let isBenar = (!isTimeout && currentSelectedOption && currentSelectedOption.isCorrect);

            userAnswers.push({
                qText: questions[currentIndex].text,
                diff: questions[currentIndex].difficulty,
                selected: isTimeout ? "WAKTU HABIS" : currentSelectedOption.text,
                correct: correctOpt.text,
                isCorrect: isBenar,
                explanation: questions[currentIndex].explanation
            });

            if (isBenar) score += 10; 

            currentIndex++;
            if (currentIndex < totalQuestions) {
                const qs = document.getElementById('quiz-screen');
                qs.classList.remove('fade-in'); void qs.offsetWidth; qs.classList.add('fade-in');
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            const res = document.getElementById('result-screen');
            res.classList.remove('hidden'); res.classList.add('fade-in');

            document.getElementById('final-score').innerText = score;
            const cCount = userAnswers.filter(a => a.isCorrect).length;
            document.getElementById('result-summary').innerHTML = `Benar: <b class="text-sky-300">${cCount}</b> &nbsp;|&nbsp; Salah: <b class="text-rose-400">${totalQuestions - cCount}</b>`;

            const container = document.getElementById('review-container');
            container.innerHTML = '';

            userAnswers.forEach((ans, idx) => {
                const div = document.createElement('div');
                div.className = `p-5 sm:p-6 rounded-2xl border-2 bg-white ${ans.isCorrect ? 'border-emerald-200' : 'border-rose-200'} shadow-sm relative overflow-hidden`;
                div.innerHTML += `<div class="absolute left-0 top-0 bottom-0 w-2 ${ans.isCorrect ? 'bg-emerald-400' : 'bg-rose-400'}"></div>`;
                
                div.innerHTML += `
                    <div class="flex flex-wrap items-center gap-2 mb-3 pl-2">
                        <span class="bg-slate-100 text-slate-700 text-xs font-bold px-2 py-1 rounded">SOAL ${idx+1}</span>
                        <span class="text-xs font-bold px-2 py-1 rounded border ${getDiffStyle(ans.diff)}">${ans.diff.toUpperCase()}</span>
                        <span class="text-xs font-bold px-3 py-1 rounded-full ml-auto ${ans.isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${ans.isCorrect ? '✓ BENAR' : '✗ SALAH'}
                        </span>
                    </div>
                    <p class="text-slate-800 font-medium mb-5 text-[15px] pl-2">${ans.qText}</p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 pl-2">
                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg">
                            <span class="block text-[11px] text-slate-500 mb-1 uppercase font-semibold">Jawaban Anda</span>
                            <span class="font-bold text-sm ${ans.isCorrect ? 'text-emerald-600' : 'text-rose-600'}">${ans.selected}</span>
                        </div>
                        <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg">
                            <span class="block text-[11px] text-blue-600 mb-1 uppercase font-semibold">Kunci Jawaban</span>
                            <span class="font-bold text-sm text-blue-700">${ans.correct}</span>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 ml-2">
                        <p class="font-bold text-slate-700 mb-2 text-sm flex items-center gap-2">
                            <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Penjelasan Singkat
                        </p>
                        <div class="text-slate-700 text-[14px] leading-relaxed">${ans.explanation}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function resetApp() {
            document.getElementById('result-screen').classList.add('hidden');
            const home = document.getElementById('home-screen');
            home.classList.remove('hidden');
            void home.offsetWidth; 
            home.classList.add('fade-in');
            
            // Uncheck category
            document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('selected'));
            selectedCategoryId = null;
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.className = 'w-full bg-slate-200 text-slate-500 font-bold py-4 rounded-xl cursor-not-allowed transition text-lg';
            btn.innerText = 'PILIH KATEGORI TERLEBIH DAHULU';
        }

        window.onload = () => { initApp(); };
    </script>
</body>
</html>
